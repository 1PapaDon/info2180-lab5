<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>World Database Lookup</title>

    <!-- Link to optional styling -->
    <link href="world.css" type="text/css" rel="stylesheet" />
</head>

<body>
    <header>
        <h1>World Database Lookup</h1>
    </header>

    <main>
        <div id="controls">
            <label for="country">Country:</label>
            <input id="country" type="search" name="country" placeholder="Enter country name" />

            <!-- Buttons required for Exercise 3 & 5 -->
            <button id="lookup">Lookup Country</button>
            <button id="cityLookup">Lookup Cities</button>
        </div>

        <hr>

        <div id="result">
            <!-- Results will be displayed here by world.js -->
        </div>
    </main>

    <!-- Load JavaScript at end for proper execution -->
    <script src="world.js"></script>
</body>
</html>
